name: MishMesh Wio L1 build (official packaging)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - build/wio-l1-mishmesh-1.18-uf2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wio-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PlatformIO
        uses: ./.github/actions/setup-build-environment
      - name: Build and package Wio Tracker L1 Pro BLE via original MishMesh build.sh
        run: bash build.sh build-firmware WioTrackerL1_companion_radio_ble_mishmesh
      - name: Upload UF2 and OTA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wio-l1-mishmesh-meshcore-1.18
          path: |
            out/WioTrackerL1_companion_radio_ble_mishmesh_*.uf2
            out/WioTrackerL1_companion_radio_ble_mishmesh_*.zip
          if-no-files-found: error
          retention-days: 14
