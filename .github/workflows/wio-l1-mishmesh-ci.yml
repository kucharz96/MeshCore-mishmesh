name: MishMesh Wio L1 integration check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wio-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PlatformIO
        uses: ./.github/actions/setup-build-environment
      - name: Build Wio Tracker L1 Pro BLE MishMesh
        run: pio run -e WioTrackerL1_companion_radio_ble_mishmesh
